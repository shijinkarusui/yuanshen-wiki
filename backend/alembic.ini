# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations
# template used to generate migration file names; The default value always
# uses datetime. If you don't want to use datetime, you can use strings
# like "slugified_comment", "seq" etc.
# file_template = %%(rev)s_%%(slug)s
# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .
# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed via pip install python-dateutil
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =
# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40
# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false
# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in a versions/ directory
# sourceless = false
# version number format. Within %%(year)d, %%(month). etc. are date values
# version_num_format = %%(year)d_%%(month).2d_%% ...
# version locations. This defaults to migrations/versions. When using
# multiple version directories, initial revisions must be specified with
# --version-path.
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions
# version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new installs is "os", which uses os.pathsep.
# version_path_separator = os
version_path_separator = os
# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false
# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

# sqlalchemy.url is intentionally left empty and is overridden in env.py
# with settings.database_url (postgresql+psycopg driver).
sqlalchemy.url =

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, identified by module
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REWRITE_HOOK

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
