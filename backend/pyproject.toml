[project]
name = "lingdebate-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.120",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<1.14",
  "psycopg[binary]>=3.1,<3.3",
  "uvicorn[standard]>=0.30,<0.35",
  "argon2-cffi>=23,<24",
  "python-multipart>=0.0.9,<0.0.20",
  "pytest>=8,<9",
  "httpx>=0.27,<0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
